name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select branch to deploy"
        required: true
        default: "deploy-frontend"
        type: choice
        options:
          - adding-feature
          - main
          - deploy-frontend

jobs:

  # ==========================================
  # BUILD FRONTEND
  # ==========================================
  build-and-test:
    name: Build and Test Frontend
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout selected branch
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.environment }}

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Clean previous build
      - name: Clean previous build
        run: |
          rm -rf dist
          rm -rf node_modules
          ls -la

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          npm ci

      # 5. Build frontend
      - name: Build frontend
        run: |
          npm run build
          ls -la
          ls -la dist

      # 6. Upload dist folder
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/


  # ==========================================
  # DEPLOY FRONTEND
  # ==========================================
  deploy:
    name: Deploy Frontend to EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      # 1. Download frontend build
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      # 2. Check downloaded files
      - name: Check frontend build
        run: |
          ls -la
          ls -la dist

      # 3. Copy dist files to EC2
      - name: Copy frontend build to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/home/ubuntu/frontend-build"

      # 4. Deploy files to Nginx
      - name: Deploy files to Nginx directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo rm -rf /var/www/ecommerce-frontend/*
            sudo cp -r /home/ubuntu/frontend-build/* /var/www/ecommerce-frontend/

      # 5. Test and reload Nginx
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl reload nginx